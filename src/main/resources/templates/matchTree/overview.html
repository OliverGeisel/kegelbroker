<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alle MatchTrees</title>
    <th:block th:replace="~{main-templates::head-default}"></th:block>

</head>
<body>
<main class="container">
    <div th:replace="~{main-templates :: navigation}"></div>
    <header>
        <h1>Alle Match-Trees</h1>
    </header>
    <section id="new-tree-section">
        <form method="post" th:action="@{/match-tree/add}">
            <div class="form-group">
                <label for="name">Name</label>
                <input class="form-control" id="name" name="name" required type="text">
            </div>
            <div class="mt-2">
                <button class="btn btn-primary">Neuen MatchTree erstellen</button>
            </div>
        </form>
    </section>
    <hr>
    <section>
        <div th:if="${matchTrees.empty}">
            Noch keine MatchTrees vorhanden!
        </div>
        <div class="row">
            <div class="card-group">
                <div class="col-3" th:each="matchTree : ${matchTrees}">
                    <div class="card">
                        <div class="card-header">
                            <span th:text="${matchTree.name}">MatchTree 1</span>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="|Tiefe: ${matchTree.getDepth()}|"></h5>
                        </div>
                        <div class="card-footer">
                            <a class="btn btn-primary" th:href="@{/match-tree/edit (id=${matchTree.id})}">Bearbeiten</a>
                            <form method="post" th:action="@{/match-tree/delete}">
                                <input name="id" th:value="${matchTree.id}" type="hidden">
                                <button class="btn btn-danger">Löschen</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
    </section>
</main>
</body>
</html>
